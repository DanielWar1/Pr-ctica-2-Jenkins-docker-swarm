{% extends 'base.html' %}
{% block title %}Registro de Usuarios{% endblock %}
{% block content %}
<div class="columns is-centered">
    <div class="column is-8-tablet is-6-desktop fade-up stagger-2">
        <div class="box">
            <h3 class="title is-4 mb-2"><i class="fa-solid fa-user-plus mr-2"></i> Registro de usuarios</h3>
            <p class="has-text-grey-lighter mb-5">Crea una cuenta para entrar al catálogo y gestionar tus juegos.</p>
            <form action="{{ url_for('registro_usuarios') }}" method="POST">
                <div class="field">
                    <label class="label" for="nombre">Nombre</label>
                    <div class="control">
                        <input class="input" type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="edad">Edad</label>
                    <div class="control">
                        <input class="input" type="number" id="edad" name="edad" min="1" max="120" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="correo">Correo</label>
                    <div class="control">
                        <input class="input" type="email" id="correo" name="correo" placeholder="usuario@correo.com" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="contrasena">Contraseña</label>
                    <div class="control">
                        <input class="input" type="password" id="contrasena" name="contrasena" required>
                    </div>
                </div>

                <div class="buttons mt-5">
                    <button type="submit" class="button is-brand">
                        <span class="icon"><i class="fa-solid fa-floppy-disk"></i></span>
                        <span>Registrar</span>
                    </button>
                    <a href="{{ url_for('inicio_sesion') }}" class="button is-light">
                        <span class="icon"><i class="fa-solid fa-right-to-bracket"></i></span>
                        <span>Ir a login</span>
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
