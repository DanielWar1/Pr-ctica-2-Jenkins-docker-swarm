version: '3.8'

services:
  web-videojuegos-final:
    image: nodensx/jenkins:latest
    ports:
      - "5009:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - red-videojuegos-final
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  red-videojuegos-final:
    external: true
