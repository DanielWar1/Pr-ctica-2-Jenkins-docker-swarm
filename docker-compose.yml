version: '3.8'

services:
  # Cambiamos el nombre del servicio a 'app-videojuegos-final'
  app-videojuegos-final:
    image: nodensx/jenkins:latest
    ports:
      - "5002:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - red-videojuegos-nueva
    deploy:
      replicas: 1
      # Esto fuerza a que si el contenedor falla, intente iniciar de nuevo
      restart_policy:
        condition: on-failure

networks:
  # La red que ya creaste manualmente
  red-videojuegos-nueva:
    external: true
