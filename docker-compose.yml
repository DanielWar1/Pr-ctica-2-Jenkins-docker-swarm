version: '3.8'

services:
  web-videojuegos-final:
    # Usamos un tag único para evitar el caché del Worker-1
    image: nodensx/jenkins:videojuegos-v1
    ports:
      - "5009:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - red-videojuegos-nueva
    deploy:
      replicas: 1

networks:
  red-videojuegos-nueva:
    external: true
