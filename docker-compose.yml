version: '3.8'

services:
  web:
    image: nodensx/jenkins:latest
    ports:
      - "5009:5000" # Mapeo externo 5009 a interno 5000
    networks:
      - red-swarm-practica2
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
    environment:
      # ACTUALIZADO: Ahora apunta a videojuegos_db
      - DATABASE_URL=postgresql://postgres:postgres@db-practica2:5432/videojuegos_db

networks:
  red-swarm-practica2:
    external: true