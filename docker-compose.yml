version: '3.8'
services:
  web-videojuegos:
    image: nodensx/pr-ctica-2-jenkins-docker-swarm:latest
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@stack-videojuegos_db-videojuegos-nueva:5432/videojuegos_db
    networks:
      - red-videojuegos-nueva
    deploy:
      replicas: 1

networks:
  red-videojuegos-nueva:
    driver: overlay
