version: '3.8'

services:
  web-videojuegos:
    image: nodensx/jenkins:latest
    ports:
      - "5009:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db-videojuegos-nueva:5432/videojuegos_db
    networks:
      - red-videojuegos-nueva
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker

networks:
  red-videojuegos-nueva:
    external: true
